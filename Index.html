
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata & Matematika</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🦌 My Little Forest</h1>
    <p>Welcome to My Website</p>
</header>

<nav>
    <button onclick="bukaHalaman('biodata')">Biodata</button>
    <button onclick="bukaHalaman('matematika')">Matematika</button>
</nav>

<section id="biodata" class="halaman">
    <h2>🌷 Biodata Diri</h2>
    <p>Nama: Nama Kamu</p>
    <p>Tempat, Tanggal Lahir: ...</p>
    <p>Alamat: ...</p>
    <p>Hobi: Membaca Novel</p>
    <p>Cita-cita: ...</p>
</section>

<section id="matematika" class="halaman">
    <h2>🧮 Kalkulator Matematika</h2>

    <input type="number" id="angka1" placeholder="Angka pertama">

    <input type="number" id="angka2" placeholder="Angka kedua">

    <br><br>

    <button onclick="hitung('+')">+</button>
    <button onclick="hitung('-')">-</button>
    <button onclick="hitung('*')">×</button>
    <button onclick="hitung('/')">÷</button>

    <h3 id="hasil">Hasil: 0</h3>
</section>

<script>
function bukaHalaman(nama) {
    document.querySelectorAll('.halaman').forEach(function(halaman) {
        halaman.style.display = 'none';
    });

    document.getElementById(nama).style.display = 'block';
}

function hitung(operator) {
    let a = Number(document.getElementById('angka1').value);
    let b = Number(document.getElementById('angka2').value);
    let hasil;

    if (operator === '+') {
        hasil = a + b;
    } else if (operator === '-') {
        hasil = a - b;
    } else if (operator === '*') {
        hasil = a * b;
    } else if (operator === '/') {
        hasil = b === 0 ? 'Tidak bisa dibagi 0' : a / b;
    }

    document.getElementById('hasil').innerHTML = 'Hasil: ' + hasil;
}

bukaHalaman('biodata');
</script>

</body>
</html>
