
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gallery</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <section class="gallery">
        <h1>My Little Gallery 🦌</h1>
        <p>A collection of my lovely memories</p>

        <div class="gallery-container">

            <div class="gallery-card">
                <img src="https://placehold.co/300x200/D8B99C/FFFFFF?text=My+Photo" alt="My Photo">
                <h3>My Photos</h3>
            </div>

            <div class="gallery-card">
                <img src="https://placehold.co/300x200/C5A080/FFFFFF?text=Memories" alt="Memories">
                <h3>My Memories</h3>
            </div>

            <div class="gallery-card">
                <img src="https://placehold.co/300x200/E8D5C4/6B4226?text=Activities" alt="Activities">
                <h3>My Activities</h3>
            </div>

            <div class="gallery-card">
                <img src="https://placehold.co/300x200/B99575/FFFFFF?text=Learning" alt="Learning">
                <h3>My Learning</h3>
            </div>

        </div>
    </section>

</body>
</html>
